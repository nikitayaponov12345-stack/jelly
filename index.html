<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Желейный легион</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f6f1ff;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: system-ui, sans-serif;
        color: #3b2a55;
      }
      #ui button {
        pointer-events: auto;
        font: inherit;
        touch-action: manipulation;
        cursor: pointer;
      }
      #ui .restart-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: #7c5cff;
        color: #fff;
        font-size: 28px;
        line-height: 48px;
        padding: 0;
      }
      #ui .play-msg {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 8px 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.75);
        color: #7c6a94;
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
      }
      #ui .play-msg[hidden] {
        display: none;
      }
      #ui .debug-line {
        position: absolute;
        left: 8px;
        bottom: 8px;
        max-width: calc(100% - 16px);
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(59, 42, 85, 0.72);
        color: #fff;
        font-size: 12px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
